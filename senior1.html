<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高一物理遊戲 | 幾何物理樂園</title>
    <!-- 引入共用的核心設計系統 -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 針對高一頁面的專屬裝飾與佈局 */
        .hero-pink {
            text-align: center;
            padding: 60px 20px;
            position: relative;
        }
        .hero-pink h1 {
            font-size: 3rem;
            color: var(--fg);
            margin-bottom: 15px;
        }
        
        /* 粉紅色的不規則幾何裝飾 (Blob) */
        .decor-blob {
            position: absolute;
            width: 140px;
            height: 140px;
            background-color: var(--secondary); 
            border: 2px solid var(--border);
            /* 利用不同的圓角半徑創造果凍般的形狀 */
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            top: 20px;
            left: 15%;
            z-index: -1;
            opacity: 0.85;
        }

        /* 頂部導覽列 (返回按鈕) */
        .top-nav {
            display: flex;
            justify-content: flex-start;
            padding: 20px;
            max-width: 1152px;
            margin: 0 auto;
        }
        .btn-back {
            display: inline-block;
            padding: 8px 24px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-full);
            font-weight: bold;
            color: var(--fg);
            text-decoration: none;
            box-shadow: 4px 4px 0px 0px var(--border);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-back:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px 0px var(--border);
            background: var(--tertiary); /* Hover 時變成充滿活力的黃色 */
        }
        .btn-back:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px var(--border);
        }
    </style>
</head>
<body>

<!-- 頂部返回區塊 -->
<div class="top-nav">
    <a href="index.html" class="btn-back">← 返回首頁</a>
</div>

<div class="container" style="padding-top: 0;">
    <!-- 頁面標題區 -->
    <div class="hero-pink">
        <div class="decor-blob"></div>
        <h1>高一物理挑戰區 ⚛️</h1>
        <p style="font-size: 1.2rem; color: var(--muted-fg); max-w-2xl; margin: 0 auto;">
            選一個遊戲，開始你的物理玩樂之旅！
        </p>
    </div>

    <!-- 遊戲卡片列表 -->
    <div class="card-grid">
        
        <!-- 遊戲 1：受力分析 -->
        <a href="game/Free-body diagram game.html" class="sticker-card card-pink">
            <h2>受力分析大挑戰 🍎📦</h2>
            <p style="color: var(--muted-fg); margin: 12px 0 24px 0; line-height: 1.6;">
                在各種物理情境中，畫出物體受到的所有力。包含靜止、加速、雙物體系統，找出隱藏的摩擦力與反作用力！
            </p>
            <div style="font-weight: 800; color: var(--secondary); font-size: 1.1rem; display: flex; align-items: center; gap: 8px;">
                開始挑戰 <span style="font-size: 1.5rem;">➔</span>
            </div>
        </a>
        
        <!-- 未來如果你要新增遊戲，只要複製上面這整塊 <a>...</a> 標籤並修改內容即可 -->

    </div>
</div>

</body>
</html>
