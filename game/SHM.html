<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡諧運動挑戰 | SHM Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #0A0A0A;
            --fg-champagne: #F2F0E4;
            --card-charcoal: #141414;
            --accent-gold: #D4AF37;
            --muted: #888888;
            --gold-glow: 0 0 15px rgba(212, 175, 55, 0.3);
            --gold-glow-strong: 0 0 25px rgba(212, 175, 55, 0.6);
            --correct-green: #2ecc71;
            --error-red: #e74c3c;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Josefin Sans', sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-obsidian); 
            color: var(--fg-champagne);
            background-image: 
                repeating-linear-gradient(45deg, rgba(212,175,55,0.03) 0, rgba(212,175,55,0.03) 1px, transparent 1px, transparent 24px),
                repeating-linear-gradient(-45deg, rgba(212,175,55,0.03) 0, rgba(212,175,55,0.03) 1px, transparent 1px, transparent 24px);
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        h1, h2, h3, .display-text { 
            font-family: 'Marcellus', serif; text-transform: uppercase; 
            letter-spacing: 0.15em; color: var(--accent-gold); font-weight: normal;
        }

        #app { 
            width: 100%; max-width: 1100px; height: 650px; 
            background: var(--card-charcoal); 
            border: 1px solid rgba(212, 175, 55, 0.4);
            position: relative; display: flex;
            box-shadow: var(--gold-glow);
        }

        .deco-corners::before, .deco-corners::after {
            content: ''; position: absolute; pointer-events: none;
            width: 30px; height: 30px; z-index: 10;
        }
        .deco-corners::before { top: 10px; left: 10px; border-top: 2px solid var(--accent-gold); border-left: 2px solid var(--accent-gold); }
        .deco-corners::after { bottom: 10px; right: 10px; border-bottom: 2px solid var(--accent-gold); border-right: 2px solid var(--accent-gold); }

        .screen { display: none; width: 100%; height: 100%; padding: 40px; position: relative; }
        #start-screen, #end-screen { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #game-screen { flex-direction: row; padding: 0; }

        #canvas-container { flex: 1; border-right: 1px solid rgba(212, 175, 55, 0.3); position: relative; background: #0c0c0c; overflow: hidden; }
        
        #ui-panel { width: 400px; padding: 30px; display: flex; flex-direction: column; background: var(--card-charcoal); position: relative; }
        .divider { width: 60%; height: 1px; background: var(--accent-gold); margin: 20px auto; opacity: 0.5; }

        .btn { 
            font-family: 'Marcellus', serif; letter-spacing: 0.1em; text-transform: uppercase;
            padding: 12px 24px; margin: 10px; font-size: 16px; cursor: pointer; 
            background: transparent; color: var(--accent-gold); 
            border: 1px solid var(--accent-gold); border-radius: 0;
            transition: all 0.3s ease-out; outline: none;
        }
        .btn:hover { background: var(--accent-gold); color: var(--bg-obsidian); box-shadow: var(--gold-glow-strong); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        
        .btn-option { 
            font-family: 'Josefin Sans', sans-serif; font-size: 15px; 
            border-color: rgba(212, 175, 55, 0.4); color: var(--fg-champagne); 
            letter-spacing: normal; width: 100%; margin: 5px 0;
            user-select: none; -webkit-user-select: none;
        }
        .btn-option.selected { background: var(--accent-gold); color: var(--bg-obsidian); border-color: var(--accent-gold); font-weight: bold; }

        .stats { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 5px; letter-spacing: 0.1em; text-transform: uppercase; }
        
        #feedback-msg { 
            font-family: 'Marcellus', serif; font-size: 16px; font-weight: bold;
            text-align: center; height: 30px; line-height: 30px; letter-spacing: 0.1em; 
            opacity: 0; transition: opacity 0.3s; margin-bottom: 10px;
        }

        #question-box { font-size: 18px; margin-bottom: 20px; color: var(--fg-champagne); min-height: 70px; line-height: 1.5; border-left: 3px solid var(--accent-gold); padding-left: 15px; transition: color 0.3s, border-color 0.3s; }
        
        .options-wrapper { display: flex; gap: 20px; margin-bottom: 20px; flex: 1; }
        .options-col { flex: 1; display: flex; flex-direction: column; }
        .options-col h4 { font-family: 'Marcellus', serif; color: var(--muted); text-align: center; margin: 0 0 10px 0; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 5px; font-weight: normal;}

        #submit-ans { margin: 0; width: 100%; border: 2px solid var(--accent-gold); font-weight: bold; }
        #hint-btn { margin: 10px 0 0 0; width: 100%; border-color: var(--muted); color: var(--muted); }
        #hint-btn:hover { border-color: var(--accent-gold); color: var(--bg-obsidian); }

        input { 
            background: transparent; border: none; border-bottom: 2px solid rgba(212,175,55,0.5);
            padding: 10px 5px; margin: 15px 0; width: 100%; font-size: 16px; 
            color: var(--fg-champagne); font-family: 'Josefin Sans', sans-serif;
            transition: all 0.3s; outline: none; text-align: center;
        }
        input::placeholder { color: var(--muted); letter-spacing: 0.1em; }
        input:focus { border-bottom-color: var(--accent-gold); box-shadow: 0 4px 10px rgba(212,175,55,0.1); }

        .modal-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(10,10,10,0.85); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 100; 
        }
        .modal-content { 
            background: var(--card-charcoal); padding: 40px; border: 1px solid var(--accent-gold); 
            text-align: center; box-shadow: var(--gold-glow-strong); position: relative; max-width: 400px;
        }
    </style>
</head>
<body>

<div id="app" class="deco-corners">
    <div id="start-screen" class="screen" style="display: flex;">
        <h1 style="font-size: 2.5rem; margin-bottom: 10px;">簡諧運動</h1>
        <div style="font-family: 'Josefin Sans'; color: var(--muted); letter-spacing: 0.2em; margin-bottom: 30px;">PHYSICS CHALLENGE</div>
        <div class="divider"></div>
        <p style="margin-bottom: 30px; color: var(--muted);">請選擇你要挑戰的物理模型</p>
        <div style="display: flex; gap: 20px;">
            <button class="btn" onclick="startGame('spring')">彈簧振子 (Spring)</button>
            <button class="btn" onclick="startGame('pendulum')">單擺 (Pendulum)</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="canvas-container"></div>
        
        <div id="ui-panel">
            <div class="stats">Progress: <span id="progress">0</span> / 10</div>
            <div id="feedback-msg">正確 CORRECT</div>
            
            <div id="question-box">載入題目中...</div>
            <div class="options-wrapper">
                <div class="options-col" id="col-direction">
                    <h4>方 向</h4>
                    <button class="btn btn-option" data-val="向左" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">向 左</button>
                    <button class="btn btn-option" data-val="向右" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">向 右</button>
                    <button class="btn btn-option" data-val="向上" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">向 上</button>
                    <button class="btn btn-option" data-val="向下" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">向 下</button>
                    <button class="btn btn-option" data-val="零" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">零</button>
                </div>
                <div class="options-col" id="col-magnitude">
                    <h4>大 小</h4>
                    <button class="btn btn-option" data-val="最大" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">最 大</button>
                    <button class="btn btn-option" data-val="最小" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">最 小</button>
                    <button class="btn btn-option" data-val="增加" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">增 加</button>
                    <button class="btn btn-option" data-val="減少" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">減 少</button>
                    <button class="btn btn-option" data-val="零" onclick="selectOpt(this)" ondblclick="deselectOpt(this)">零</button>
                </div>
            </div>
            <button class="btn" id="submit-ans" onclick="checkAnswer()">確認答案</button>
            <button class="btn" id="hint-btn" onclick="useHint()">顯示物理量向量 (-5分)</button>
        </div>
    </div>

    <div id="end-screen" class="screen">
        <h1 id="end-title" style="font-size: 2.5rem; margin-bottom: 10px;">挑戰完成</h1>
        <div class="divider"></div>
        <p id="end-score" class="display-text" style="font-size: 1.5rem; margin-bottom: 30px;">SCORE: 100</p>
        <div style="width: 320px; text-align: center;">
            <input type="text" id="student-class" placeholder="班別 (CLASS)">
            <input type="text" id="student-name" placeholder="姓名 (NAME)">
            <input type="text" id="student-id" placeholder="學號 (ID)">
            <button class="btn" onclick="submitScore()" style="width: 100%; margin: 20px 0 10px 0;">上傳成績 (SUBMIT)</button>
            <button class="btn" onclick="resetGame()" style="width: 100%; border-color: var(--muted); color: var(--muted); margin: 0;">返回主畫面 (HOME)</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="idle-modal" class="modal-overlay">
        <div class="modal-content deco-corners">
            <h3 style="margin-top: 0;">ATTENTION</h3>
            <p style="color: var(--muted); margin-bottom: 30px;">Are you still thinking?</p>
            <button class="btn" onclick="resumeFromIdle()">繼續 (CONTINUE)</button>
        </div>
    </div>
    <div id="blur-modal" class="modal-overlay">
        <div class="modal-content deco-corners">
            <h3 style="margin-top: 0; color: var(--error-red);">WARNING</h3>
            <p style="color: var(--muted); margin-bottom: 30px;">禁止離開頁面或切換視窗！<br>系統已判定違規，遊戲將從第一關重新開始。</p>
            <button class="btn" onclick="resumeFromBlur()">重新開始 (RESTART)</button>
        </div>
    </div>
</div>

<script>
    const baseQuestionBank = [
        { q: "物體在位置 A (左側極值) 時的「位移 (x)」為？", ans: ["向左", "最大"], var: "x" },
        { q: "物體在位置 A (左側極值) 時的「速度 (v)」為？", ans: ["零"], var: "v" }, 
        { q: "物體在位置 A (左側極值) 時的「回復力 (F)」為？", ans: ["向右", "最大"], var: "F" },
        { q: "物體在位置 A (左側極值) 時的「動能」為？", ans: ["零"], var: "Ek" },
        { q: "物體從 A 運動到 O (A→O) 時，「位移 (x)」大小如何變化？", ans: ["減少"], var: "x" },
        { q: "物體從 A 運動到 O (A→O) 時的「速度 (v)」為？", ans: ["向右", "增加"], var: "v" },
        { q: "物體從 A 運動到 O (A→O) 時，「勢能」如何變化？", ans: ["減少"], var: "Ep" },
        { q: "物體在位置 O (平衡位置) 時的「位移 (x)」為？", ans: ["零"], var: "x" },
        { q: "物體在位置 O (平衡位置) 時的「速度 (v)」大小為？", ans: ["最大"], var: "v" },
        { q: "物體在位置 O (平衡位置) 時的「加速度 (a)」為？", ans: ["零"], var: "a" },
        { q: "物體從 O 運動到 B (O→B) 時的「回復力 (F)」為？", ans: ["向左", "增加"], var: "F" },
        { q: "物體從 O 運動到 B (O→B) 時，「動能」如何變化？", ans: ["減少"], var: "Ek" },
        { q: "物體在位置 B (右側極值) 時的「加速度 (a)」為？", ans: ["向左", "最大"], var: "a" }
    ];

    let modelType = 'spring';
    let springOrientation = 'horizontal'; 
    let currentQuestions = [];
    let currentQIndex = 0;
    let selectedOptions = new Set();
    
    let score = 100;
    let idleInterval;
    let isPlaying = false;
    let isChecking = false; 
    let hintActiveForCurrent = false;
    
    let gameStartTime = ""; let gameEndTime = "";   

    let lastActivityTime = Date.now();
    let isIdle = false; let isBlurred = false;
    
    let animationId; let phase = 0;

    let userIP = "Unknown";
    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => userIP = data.ip).catch(e => console.log("IP fetch failed"));

    window.onload = () => {
        ['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(evt => 
            document.addEventListener(evt, () => lastActivityTime = Date.now())
        );
        window.addEventListener('blur', () => {
            if (isPlaying && !isBlurred && !isIdle && !isChecking) {
                isBlurred = true; 
                document.getElementById('blur-modal').style.display = 'flex';
            }
        });
    };

    function startGame(type) {
        modelType = type;
        gameStartTime = new Date().toLocaleString('zh-HK', { hour12: false }); 
        
        // 核心更新：不管刷新多少次，只要未通關，就會讀取並鎖定同一個方向
        if (type === 'spring') {
            let lockedOrient = localStorage.getItem('shm_current_orientation');
            if (!lockedOrient) {
                // 如果是第一次玩，或是已通關後重新開始，就隨機分配一個新方向並上鎖
                lockedOrient = Math.random() > 0.5 ? 'horizontal' : 'vertical';
                localStorage.setItem('shm_current_orientation', lockedOrient);
            }
            springOrientation = lockedOrient;
        }

        let dynamicBank = JSON.parse(JSON.stringify(baseQuestionBank));
        if (type === 'spring' && springOrientation === 'vertical') {
            dynamicBank.forEach(q => {
                q.q = q.q.replace(/左/g, "上").replace(/右/g, "下");
                q.ans = q.ans.map(a => a.replace(/左/g, "上").replace(/右/g, "下"));
            });
        }

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        
        currentQuestions = dynamicBank.sort(() => 0.5 - Math.random()).slice(0, 10);
        currentQIndex = 0; score = 100;
        isPlaying = true; isChecking = false;
        
        loadQuestion();
        lastActivityTime = Date.now();
        idleInterval = setInterval(checkIdleStatus, 1000);
        
        animationId = requestAnimationFrame(animatePhysicsSVG);
    }

    function resetGame() {
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
        document.getElementById('student-class').value = '';
        document.getElementById('student-name').value = '';
        document.getElementById('student-id').value = '';
    }

    function loadQuestion() {
        hintActiveForCurrent = false; selectedOptions.clear();
        document.querySelectorAll('.btn-option').forEach(btn => btn.classList.remove('selected'));
        let qData = currentQuestions[currentQIndex];
        document.getElementById('question-box').innerText = `Q${currentQIndex + 1}: ${qData.q}`;
        document.getElementById('progress').innerText = currentQIndex;
        document.getElementById('submit-ans').disabled = false;
    }

    function updateSelectedOptions() {
        selectedOptions.clear();
        document.querySelectorAll('.btn-option.selected').forEach(b => {
            selectedOptions.add(b.getAttribute('data-val'));
        });
    }

    function selectOpt(btn) {
        if (isChecking) return;
        let col = btn.parentElement;
        col.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        updateSelectedOptions();
    }

    function deselectOpt(btn) {
        if (isChecking) return;
        btn.classList.remove('selected');
        updateSelectedOptions();
    }

    function checkAnswer() {
        if (isChecking) return;
        isChecking = true;
        document.getElementById('submit-ans').disabled = true;

        let correctAns = currentQuestions[currentQIndex].ans;
        let playerAns = Array.from(selectedOptions);
        let isCorrect = true;

        if (correctAns.includes("零") && correctAns.length === 1) {
             isCorrect = playerAns.includes("零") || playerAns.includes("最小");
        } else {
             if(playerAns.length < correctAns.length) isCorrect = false;
             correctAns.forEach(ans => { if(!playerAns.includes(ans)) isCorrect = false; });
             if(playerAns.length > correctAns.length + 1) isCorrect = false; 
        }

        let feedbackEl = document.getElementById('feedback-msg');
        let qBox = document.getElementById('question-box');

        if (isCorrect) {
            feedbackEl.innerText = "答對了！ CORRECT";
            feedbackEl.style.color = "var(--correct-green)";
            feedbackEl.style.opacity = 1;
            qBox.style.color = 'var(--correct-green)';
            qBox.style.borderLeftColor = 'var(--correct-green)';
            
            setTimeout(() => {
                feedbackEl.style.opacity = 0;
                qBox.style.color = 'var(--fg-champagne)';
                qBox.style.borderLeftColor = 'var(--accent-gold)';
                isChecking = false;
                
                currentQIndex++;
                if (currentQIndex >= 10) endGame(); else loadQuestion();
            }, 1200);
        } else {
            feedbackEl.innerHTML = "答錯了！ INCORRECT<br><span style='font-size:12px;'>即將由第一關重新開始</span>";
            feedbackEl.style.color = "var(--error-red)";
            feedbackEl.style.opacity = 1;
            qBox.style.color = 'var(--error-red)'; 
            qBox.style.borderLeftColor = 'var(--error-red)';
            
            setTimeout(() => { 
                feedbackEl.style.opacity = 0;
                qBox.style.color = 'var(--fg-champagne)'; 
                qBox.style.borderLeftColor = 'var(--accent-gold)'; 
                
                // 重置進度，分數重回 100，回到第一題
                currentQIndex = 0;
                score = 100;
                loadQuestion();
                isChecking = false;
            }, 2000);
        }
    }

    function useHint() { 
        if (!hintActiveForCurrent && !isChecking) { 
            score = Math.max(0, score - 5); 
            hintActiveForCurrent = true; 
        } 
    }

    function checkIdleStatus() {
        if (!isPlaying || isChecking) return;
        if (Date.now() - lastActivityTime > 10000 && !isIdle && !isBlurred) {
            isIdle = true; document.getElementById('idle-modal').style.display = 'flex';
        }
    }

    function resumeFromIdle() { 
        isIdle = false; 
        document.getElementById('idle-modal').style.display = 'none'; 
        lastActivityTime = Date.now(); 
    }
    
    function resumeFromBlur() { 
        isBlurred = false; 
        document.getElementById('blur-modal').style.display = 'none'; 
        lastActivityTime = Date.now(); 
        
        // 失焦懲罰：重置進度與分數，回到第一題
        currentQIndex = 0;
        score = 100;
        loadQuestion();
    }

    function endGame() {
        isPlaying = false; clearInterval(idleInterval); cancelAnimationFrame(animationId);
        gameEndTime = new Date().toLocaleString('zh-HK', { hour12: false });
        
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
        
        // 核心更新：只有在這裡 (成功連對10題通關) 才會解除方向鎖定
        localStorage.removeItem('shm_current_orientation');
        document.getElementById('end-score').innerText = `SCORE: ${score}`; 
    }

    function animatePhysicsSVG() {
        if (!isPlaying) return;
        
        const container = document.getElementById('canvas-container');
        const w = container.clientWidth;
        const h = container.clientHeight;
        
        if (w === 0 || h === 0) {
            animationId = requestAnimationFrame(animatePhysicsSVG);
            return;
        }
        
        phase += 0.03; 
        const cx = w / 2;
        const cy = h / 2;
        const amplitude = 120;
        const displacement = Math.cos(phase) * amplitude;

        let svg = `<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="crosshatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1" />
                </pattern>
            </defs>`;

        const drawMark = (x, y, text, isVert) => {
            if (isVert) {
                svg += `<line x1="${x-60}" y1="${y}" x2="${x+60}" y2="${y}" stroke="rgba(212, 175, 55, 0.3)" stroke-dasharray="4,4" />`;
                svg += `<text x="${x+80}" y="${y+6}" fill="#D4AF37" font-family="Marcellus" font-size="20" text-anchor="middle">${text}</text>`;
            } else {
                svg += `<line x1="${x}" y1="${y-60}" x2="${x}" y2="${y+60}" stroke="rgba(212, 175, 55, 0.3)" stroke-dasharray="4,4" />`;
                svg += `<text x="${x}" y="${y+80}" fill="#D4AF37" font-family="Marcellus" font-size="20" text-anchor="middle">${text}</text>`;
            }
        };

        if (modelType === 'spring' && springOrientation === 'horizontal') {
            drawMark(cx, cy, "O", false);
            drawMark(cx - amplitude, cy, "A", false);
            drawMark(cx + amplitude, cy, "B", false);
        } else if (modelType === 'spring' && springOrientation === 'vertical') {
            drawMark(cx, cy, "O", true);
            drawMark(cx, cy - amplitude, "A", true); 
            drawMark(cx, cy + amplitude, "B", true); 
        } else if (modelType === 'pendulum') {
            let pendLen = 200; let maxAng = Math.PI / 6;
            drawMark(cx, cy + pendLen - 100, "O", false);
            drawMark(cx - Math.sin(maxAng)*pendLen, cy + Math.cos(maxAng)*pendLen - 100, "A", false);
            drawMark(cx + Math.sin(maxAng)*pendLen, cy + Math.cos(maxAng)*pendLen - 100, "B", false);
        }

        let massX = cx; let massY = cy;

        if (modelType === 'pendulum') {
            let angle = Math.cos(phase) * (Math.PI / 6);
            let length = 200;
            massX = cx + Math.sin(angle) * length;
            massY = cy - 100 + Math.cos(angle) * length;
            
            svg += `<line x1="${cx-40}" y1="${cy-100}" x2="${cx+40}" y2="${cy-100}" stroke="#D4AF37" stroke-width="2" />`;
            svg += `<line x1="${cx}" y1="${cy-100}" x2="${massX}" y2="${massY}" stroke="#D4AF37" stroke-width="2" />`;
            
            svg += `<circle cx="${massX}" cy="${massY}" r="22" fill="#141414" stroke="#D4AF37" stroke-width="2" />`;
            svg += `<circle cx="${massX}" cy="${massY}" r="16" fill="none" stroke="rgba(212,175,55,0.5)" stroke-width="1" />`;
            svg += `<text x="${massX}" y="${massY+5}" fill="#F2F0E4" font-family="'Marcellus', serif" font-style="italic" font-size="16" text-anchor="middle">m</text>`;

        } else if (modelType === 'spring') {
            let coils = 16; let blockW = 60, blockH = 50; let springRadius = 14;

            if (springOrientation === 'horizontal') {
                massX = cx - displacement;
                let wallX = cx - amplitude - 100;
                
                svg += `<rect x="${wallX}" y="${cy-50}" width="20" height="100" fill="#141414" stroke="#D4AF37" stroke-width="2" />`;
                svg += `<rect x="${wallX}" y="${cy-50}" width="20" height="100" fill="url(#crosshatch)" />`;

                let startX = wallX + 20; let endX = massX - blockW/2;
                let pathD = `M ${startX} ${cy}`;
                let springW = endX - startX;
                for(let i=1; i<=coils; i++) {
                    let x = startX + (i * springW / coils);
                    let y = cy + (i % 2 === 0 ? springRadius : -springRadius);
                    if(i === coils) y = cy;
                    pathD += ` L ${x} ${y}`;
                }
                svg += `<path d="${pathD}" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;
                massY = cy;

            } else {
                massY = cy - displacement;
                let ceilingY = cy - amplitude - 100;
                
                svg += `<rect x="${cx-50}" y="${ceilingY}" width="100" height="20" fill="#141414" stroke="#D4AF37" stroke-width="2" />`;
                svg += `<rect x="${cx-50}" y="${ceilingY}" width="100" height="20" fill="url(#crosshatch)" />`;

                let startY = ceilingY + 20; let endY = massY - blockH/2;
                let pathD = `M ${cx} ${startY}`;
                let springH = endY - startY;
                for(let i=1; i<=coils; i++) {
                    let y = startY + (i * springH / coils);
                    let x = cx + (i % 2 === 0 ? springRadius : -springRadius);
                    if(i === coils) x = cx;
                    pathD += ` L ${x} ${y}`;
                }
                svg += `<path d="${pathD}" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;
                massX = cx;
            }
            
            svg += `<rect x="${massX - blockW/2}" y="${massY - blockH/2}" width="${blockW}" height="${blockH}" fill="#141414" stroke="#D4AF37" stroke-width="2" />`;
            svg += `<rect x="${massX - blockW/2 + 4}" y="${massY - blockH/2 + 4}" width="${blockW - 8}" height="${blockH - 8}" fill="none" stroke="rgba(212, 175, 55, 0.5)" stroke-width="1" />`;
            svg += `<text x="${massX}" y="${massY+7}" fill="#F2F0E4" font-family="'Marcellus', serif" font-style="italic" font-size="22" text-anchor="middle">m</text>`;
        }

        if (hintActiveForCurrent) {
            let variable = currentQuestions[currentQIndex].var;
            let vecLength = 0; let color = '#D4AF37';
            
            if (variable === 'Ek' || variable === 'Ep') {
                let eLevel = variable === 'Ek' ? Math.pow(Math.sin(phase), 2) : Math.pow(Math.cos(phase), 2);
                let maxE = 45; 
                let eHeight = eLevel * maxE;
                
                let boxX = massX - 10;
                let boxY = massY - 90;
                if (modelType === 'spring' && springOrientation === 'vertical') {
                    boxX = massX + 50; 
                    boxY = massY - (maxE / 2); 
                } else if (modelType === 'pendulum') {
                    boxX = massX + 35;
                    boxY = massY - 35;
                }
                
                svg += `<rect x="${boxX}" y="${boxY}" width="20" height="${maxE}" fill="#141414" stroke="rgba(212,175,55,0.5)" stroke-width="2" />`;
                svg += `<rect x="${boxX}" y="${boxY + maxE - eHeight}" width="20" height="${eHeight}" fill="#D4AF37" />`;
                svg += `<text x="${boxX + 10}" y="${boxY - 10}" fill="#D4AF37" font-family="Josefin Sans" font-size="16" text-anchor="middle">${variable}</text>`;
            } 
            else {
                if (variable === 'x') vecLength = -Math.cos(phase) * 60;
                if (variable === 'v') vecLength = Math.sin(phase) * 60;
                if (variable === 'F' || variable === 'a') vecLength = Math.cos(phase) * 60;

                if (Math.abs(vecLength) > 5) {
                    if (modelType === 'spring' && springOrientation === 'vertical') {
                        svg += `<line x1="${massX+50}" y1="${massY}" x2="${massX+50}" y2="${massY+vecLength}" stroke="${color}" stroke-width="3" />`;
                        let pts = vecLength > 0 ? 
                            `${massX+50},${massY+vecLength} ${massX+45},${massY+vecLength-10} ${massX+55},${massY+vecLength-10}` : 
                            `${massX+50},${massY+vecLength} ${massX+45},${massY+vecLength+10} ${massX+55},${massY+vecLength+10}`;
                        svg += `<polygon points="${pts}" fill="${color}" />`;
                        svg += `<text x="${massX+75}" y="${massY+vecLength/2 + 5}" fill="${color}" font-family="Josefin Sans" font-size="16" text-anchor="middle">${variable}</text>`;
                    } else {
                        svg += `<line x1="${massX}" y1="${massY-50}" x2="${massX+vecLength}" y2="${massY-50}" stroke="${color}" stroke-width="3" />`;
                        let pts = vecLength > 0 ? 
                            `${massX+vecLength},${massY-50} ${massX+vecLength-10},${massY-55} ${massX+vecLength-10},${massY-45}` : 
                            `${massX+vecLength},${massY-50} ${massX+vecLength+10},${massY-55} ${massX+vecLength+10},${massY-45}`;
                        svg += `<polygon points="${pts}" fill="${color}" />`;
                        svg += `<text x="${massX+vecLength/2}" y="${massY-65}" fill="${color}" font-family="Josefin Sans" font-size="16" text-anchor="middle">${variable}</text>`;
                    }
                }
            }
        }

        svg += `</svg>`;
        container.innerHTML = svg; 
        animationId = requestAnimationFrame(animatePhysicsSVG);
    }

    function submitScore() {
        const pClass = document.getElementById('student-class').value;
        const pName = document.getElementById('student-name').value;
        const pId = document.getElementById('student-id').value;
        
        if(!pClass || !pName || !pId) { 
            alert("請完整填寫班別、姓名及學號！"); 
            return; 
        }

        const data = { 
            date: new Date().toLocaleDateString('zh-HK'), 
            startTime: gameStartTime, 
            endTime: gameEndTime, 
            duration: "N/A",      
            score: score,
            name: pName, 
            classStr: pClass,     
            studentId: pId,
            ip: userIP            
        };

        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwh14WyXP6jiDNtKZVI_y2HfkYnL_BlLP-Ffm5yioIeen-c7xOG7ItiWKWpQMSt5BtgEg/exec'; 
        
        if (GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_SCRIPT_WEB_APP_URL') { 
            alert("成績已記錄 (本地測試)\n分數: " + data.score); 
            return; 
        }
        
        const btn = document.querySelector('#end-screen button'); 
        btn.innerText = "UPLOADING...";
        
        fetch(GOOGLE_SCRIPT_URL, { 
            method: 'POST', 
            body: JSON.stringify(data), 
            headers: { 'Content-Type': 'text/plain' }
        })
        .then(res => res.text())
        .then(resText => { 
            if(resText.includes("success")) {
                alert("成績上傳成功！"); 
                btn.innerText = "已上傳 (UPLOADED)"; 
                btn.disabled = true; 
            } else {
                alert("伺服器發生異常，請檢查 Google Sheet 錯誤紀錄。"); 
                btn.innerText = "重試上傳 (RETRY)"; 
            }
        })
        .catch(err => { 
            console.error("Fetch Error:", err);
            alert("上傳失敗，請檢查網絡連線。"); 
            btn.innerText = "重試上傳 (RETRY)"; 
        });
    }
</script>
