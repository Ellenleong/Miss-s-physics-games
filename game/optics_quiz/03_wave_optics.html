.letter{background:var(--primary);color:#fff}.bottom-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.feedback{display:none;margin-top:14px;border-radius:13px;padding:12px 14px;font-weight:700;line-height:1.55}.feedback.ok{display:block;background:#ecfdf3;border:1px solid #a9e5c8;color:#08724e}.feedback.bad{display:block;background:#fff1f0;border:1px solid #f1b6b2;color:#a1261d}.overlay{position:fixed;inset:0;background:rgba(10,20,35,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.overlay.show{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal h3{margin:0 0 9px}.modal p{color:var(--muted);line-height:1.65}.scorebox{font-size:46px;font-weight:950;color:var(--primary);margin:8px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.form-grid input{width:100%;border:1px solid #b9c5d6;border-radius:11px;padding:11px 12px}.privacy{font-size:12px;color:var(--muted);line-height:1.55;background:#f8fafc;border:1px solid var(--line);padding:10px;border-radius:10px;margin:10px 0}.submit-status{font-size:13px;margin-top:8px;color:var(--muted)}.hidden{display:none!important}

</style></head><body>
<div class="app"><div class="topbar"><div class="brand"><h1>3. 光的干涉、繞射與色散</h1><small>高中光學互動測驗</small></div><div class="top-actions"><div class="focus-lock" title="切換分頁或其他 App 會返回第 1 題"><span class="dot"></span>專注模式</div><div class="timer">⏱ <span id="timerText">00:00</span></div><button id="restartBtn" class="btn">重新開始</button><button id="homeBtn" class="btn">返回主頁</button></div></div>
<div class="statusbar"><strong>3. 光的干涉、繞射與色散</strong><div class="status-right"><span>題目：<b id="progressText">1 / 10</b></span><span class="internal-stat">失敗重來：<b id="failCount">0</b></span><span class="internal-stat">手動重開：<b id="restartCount">0</b></span><span>學生：<b id="studentBadge"></b></span></div></div>
<div class="question-card"><div id="questionTitle" class="question-title"></div><div id="questionSub" class="question-sub"></div><div id="answerArea" class="answer-panel"></div><div id="feedback" class="feedback"></div><div class="bottom-actions"><button id="hintBtn" class="btn hint-btn">提示（-5分）</button><button id="checkBtn" class="btn primary">檢查答案</button></div></div></div>
<div id="studentOverlay" class="overlay"><div class="modal"><h3>學生資料</h3><p>找不到主頁所儲存的學生資料。請在此輸入一次。</p><div class="form-grid"><input id="stuClass" placeholder="班別"><input id="stuId" placeholder="學號"><input id="stuName" class="full" placeholder="姓名"></div><div id="studentStatus" class="submit-status"></div><button id="studentEnter" class="btn primary" style="width:100%;margin-top:12px">開始測驗</button></div></div>
<div id="failOverlay" class="overlay"><div class="modal"><h3>本題未通過</h3><p id="failMessage"></p><p><strong>依規則，本部分返回第 1 題；計時繼續。</strong></p><button id="failContinue" class="btn primary" style="width:100%">由第 1 題重新開始</button></div></div>
<div id="focusOverlay" class="overlay"><div class="modal"><h3>專注模式：偵測到離開測驗</h3><p>測驗期間不可切換分頁、其他 App 或其他內容。</p><p><strong>本部分返回第 1 題；計時繼續。</strong></p><button id="focusContinue" class="btn primary" style="width:100%">返回第 1 題繼續</button></div></div>
<div id="hintOverlay" class="overlay"><div class="modal"><h3>提示</h3><p id="hintMessage" class="hint-text"></p><p class="hint-cost">使用本次提示扣 5 分。</p><button id="hintClose" class="btn primary" style="width:100%">繼續作答</button></div></div>
<div id="finishOverlay" class="overlay"><div class="modal"><h3>完成 10 題</h3><div id="scoreBox" class="scorebox">100</div><p id="finishSummary"></p><p>學生：<strong id="finishStudent"></strong></p><div class="privacy">每個部分獨立提交。Google Sheet 會記錄本次測驗的基本成績資料。</div><button id="submitBtn" class="btn ok" style="width:100%">提交成績至 Google Sheet</button><div id="submitStatus" class="submit-status"></div><button id="finishHome" class="btn" style="width:100%;margin-top:9px">返回主頁</button></div></div>
<script>(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const MODULE_NAME='3. 光的干涉、繞射與色散';
const IP_ENDPOINT='https://api64.ipify.org?format=json';
const student={className:'',studentId:'',name:''};
const state={qIndex:0,seconds:0,timer:null,startedAt:null,endedAt:null,failCount:0,restartCount:0,hintCount:0,selectedOption:null,answerValue:'',finished:false};
const HINTS=["光速關係：<strong>c = fλ</strong>。留意 m 與 nm 的換算。", "雙縫條紋間距：<strong>Δy = λL/d</strong>。", "亮紋：<strong>Δ = mλ</strong>；暗紋：<strong>Δ = (m+1/2)λ</strong>。", "比較路程差 Δ 與 λ：整數倍為亮，半整數倍為暗。", "先用 <strong>c = fλ</strong> 找 λ，再判斷路程差。", "介質中波長：<strong>λ = λ₀/n</strong>；條紋間距仍看 Δy = λL/d。", "折射定律：<strong>n₁ sin i = n₂ sin r</strong>；紅、紫光分開計算。", "狹縫寬度與波長<strong>同數量級</strong>時，繞射較明顯。", "雙縫條紋間距：<strong>Δy = λL/d</strong>；d 增大，條紋變密。", "有色濾光片主要讓<strong>自身顏色</strong>的光通過。"];
function fmtTime(sec){const m=Math.floor(sec/60).toString().padStart(2,'0'),s=(sec%60).toString().padStart(2,'0');return `${m}:${s}`}
function scoreFor(sec){let base=sec<=200?100:100-Math.ceil((sec-200)/10)*5;return Math.max(60,base-state.hintCount*5)}
function updateTimer(){$('#timerText').textContent=fmtTime(state.seconds)}
function syncTimerFromClock(){if(!state.startedAt||state.finished)return;state.seconds=Math.max(0,Math.floor((Date.now()-state.startedAt.getTime())/1000));updateTimer()}
function startTimer(){clearInterval(state.timer);syncTimerFromClock();state.timer=setInterval(syncTimerFromClock,500)}
function stopTimer(){clearInterval(state.timer);state.timer=null}

const focusGuard={armed:false,triggered:false,suppressUntil:0,blurTimer:null,keyboardLikelyOpen:false};
function isEditableTarget(el){return !!el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable)}
function refreshKeyboardState(){
  const el=document.activeElement,vv=window.visualViewport;
  const reduced=vv?Math.max(0,window.innerHeight-vv.height):0;
  focusGuard.keyboardLikelyOpen=!!(isEditableTarget(el)&&vv&&reduced>120);
}
function suppressFocusGuard(ms=1800){focusGuard.suppressUntil=Date.now()+ms}
function armFocusGuard(){focusGuard.armed=true;focusGuard.triggered=false;refreshKeyboardState()}
function disarmFocusGuard(){focusGuard.armed=false;focusGuard.triggered=false;if(focusGuard.blurTimer){clearTimeout(focusGuard.blurTimer);focusGuard.blurTimer=null}}
function triggerFocusPenalty(){
  if(!focusGuard.armed||state.finished||focusGuard.triggered||Date.now()<focusGuard.suppressUntil)return;
  const fail=$('#failOverlay');if(fail&&fail.classList.contains('show'))return;
  focusGuard.triggered=true;
  syncTimerFromClock();
  state.failCount++;
  const fc=$('#failCount');if(fc)fc.textContent=state.failCount;
  const hint=$('#hintOverlay');if(hint)hint.classList.remove('show');
  const fb=$('#feedback');if(fb)fb.style.display='none';
  const cb=$('#checkBtn');if(cb)cb.disabled=true;
  $('#focusOverlay').classList.add('show');
}
function resumeAfterFocusPenalty(){
  $('#focusOverlay').classList.remove('show');
  state.qIndex=0;
  const cb=$('#checkBtn');if(cb)cb.disabled=false;
  focusGuard.triggered=false;
  renderQuestion();
}
$('#focusContinue').addEventListener('click',resumeAfterFocusPenalty);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',refreshKeyboardState,{passive:true});
  window.visualViewport.addEventListener('scroll',refreshKeyboardState,{passive:true});
}
document.addEventListener('focusin',()=>setTimeout(refreshKeyboardState,80),true);
document.addEventListener('focusout',()=>setTimeout(refreshKeyboardState,160),true);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)triggerFocusPenalty();
  else{syncTimerFromClock();refreshKeyboardState()}
});
window.addEventListener('blur',()=>{
  if(focusGuard.blurTimer)clearTimeout(focusGuard.blurTimer);
  focusGuard.blurTimer=setTimeout(()=>{
    refreshKeyboardState();
    if(document.hidden){triggerFocusPenalty();return}
    // iPad/iPhone software keyboard may blur the window while an input remains active.
    if(focusGuard.keyboardLikelyOpen&&isEditableTarget(document.activeElement))return;
    if(!document.hasFocus())triggerFocusPenalty();
  },700);
});
window.addEventListener('focus',()=>{
  if(focusGuard.blurTimer){clearTimeout(focusGuard.blurTimer);focusGuard.blurTimer=null}
  syncTimerFromClock();refreshKeyboardState();
});
window.addEventListener('beforeunload',e=>{
  if(focusGuard.armed&&!state.finished){e.preventDefault();e.returnValue=''}
});

function setFeedback(type,msg){const f=$('#feedback');f.className=`feedback ${type}`;f.innerHTML=msg}
function clearFeedback(){const f=$('#feedback');f.className='feedback';f.innerHTML=''}
function updateStudentUI(){const t=`${student.className}｜${student.studentId}｜${student.name}`;$('#studentBadge').textContent=t;$('#finishStudent').textContent=t}
function loadStudent(){try{const x=JSON.parse(localStorage.getItem('opticsStudent')||'null');if(x&&x.className&&x.studentId&&x.name){Object.assign(student,x);updateStudentUI();return true}}catch{}$('#studentOverlay').classList.add('show');return false}
function saveStudent(){const c=$('#stuClass').value.trim(),id=$('#stuId').value.trim(),n=$('#stuName').value.trim();if(!c||!id||!n){$('#studentStatus').textContent='請完整填寫資料。';return false}Object.assign(student,{className:c,studentId:id,name:n});localStorage.setItem('opticsStudent',JSON.stringify(student));updateStudentUI();$('#studentOverlay').classList.remove('show');startTest(false);return true}
$('#studentEnter').addEventListener('click',saveStudent);
function startTest(manual=false){if(manual)state.restartCount++;else state.restartCount=0;state.qIndex=0;state.seconds=0;state.failCount=0;state.selectedOption=null;state.answerValue='';state.hintCount=0;state.finished=false;state.startedAt=new Date();state.endedAt=null;$('#failCount').textContent='0';$('#restartCount').textContent=state.restartCount;updateTimer();prepareBank();renderQuestion();startTimer();armFocusGuard()}
$('#restartBtn').addEventListener('click',()=>{suppressFocusGuard(1800);if(confirm('確定重新開始本測試？題目與計時會重設。'))startTest(true)});
function goHome(){disarmFocusGuard();stopTimer();location.href='index.html'}
$('#homeBtn').addEventListener('click',()=>{suppressFocusGuard(1800);if(confirm('返回主頁會離開目前測試，確定嗎？'))goHome()});$('#finishHome').addEventListener('click',goHome);
function failQuestion(message){state.failCount++;$('#failCount').textContent=state.failCount;$('#failMessage').innerHTML=message;$('#failOverlay').classList.add('show');$('#checkBtn').disabled=true}
$('#failContinue').addEventListener('click',()=>{$('#failOverlay').classList.remove('show');state.qIndex=0;$('#checkBtn').disabled=false;renderQuestion()});

function currentHintText(){
  const q=(typeof BANK!=="undefined"&&BANK[state.qIndex])?BANK[state.qIndex]:null;
  if(q&&q.hint)return q.hint;
  if(typeof HINTS!=="undefined"&&HINTS[state.qIndex])return HINTS[state.qIndex];
  return '先找出本題涉及的基本光學定律，再逐步判斷。';
}
function showHint(){if(state.finished)return;state.hintCount++;$('#hintMessage').innerHTML=currentHintText();$('#hintOverlay').classList.add('show')}
$('#hintBtn').addEventListener('click',showHint);
$('#hintClose').addEventListener('click',()=>$('#hintOverlay').classList.remove('show'));
function passQuestion(){setFeedback('ok','✓ 正確。');$('#checkBtn').disabled=true;setTimeout(()=>{state.qIndex++;if(state.qIndex>=10)finishModule();else{$('#checkBtn').disabled=false;renderQuestion()}},350)}
function finishModule(){state.finished=true;disarmFocusGuard();stopTimer();state.endedAt=new Date();const score=scoreFor(state.seconds);$('#scoreBox').textContent=score;$('#finishSummary').innerHTML=`${MODULE_NAME}<br>完成時間：<strong>${fmtTime(state.seconds)}</strong><br>分數已包含提示扣分。`;$('#submitStatus').textContent='';$('#submitBtn').disabled=false;$('#finishOverlay').classList.add('show')}
function formatLocalDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatLocalClock(d){return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function getGoogleScriptUrl(){
  const q=new URLSearchParams(location.search).get('gas');
  if(q){try{localStorage.setItem('opticsGoogleScriptUrl_v4',q)}catch{} return q;}
  try{return localStorage.getItem('opticsGoogleScriptUrl_v4')||''}catch{return ''}
}
async function submitScore(){
  let url=getGoogleScriptUrl();
  if(!url){
    const entered=prompt('尚未設定 Google Apps Script Web App URL。請貼上以 /exec 結尾的網址：','');
    if(!entered){$('#submitStatus').textContent='未設定提交網址，尚未上傳。';return;}
    url=entered.trim();
    try{localStorage.setItem('opticsGoogleScriptUrl_v4',url)}catch{}
  }
  const btn=$('#submitBtn');btn.disabled=true;$('#submitStatus').textContent='正在提交成績至「03_干涉繞射色散」…';
  const ended=state.endedAt||new Date();
  const started=state.startedAt||new Date(ended.getTime()-state.seconds*1000);
  const payload={
    exerciseNo:3,
    routingVersion:'v5',
    exerciseKey:'wave',
    sheetName:'03_干涉繞射色散',
    sourcePage:'03_wave_optics.html',
    date:formatLocalDate(ended),
    startTime:formatLocalClock(started),
    endTime:formatLocalClock(ended),
    duration:state.seconds,
    score:scoreFor(state.seconds),
    failCount:state.failCount,
    restartCount:state.restartCount,
    name:student.name,
    classStr:student.className,
    studentId:student.studentId
  };
  try{
    const routedUrl=url+(url.includes('?')?'&':'?')+'exerciseNo=3&sheetName='+encodeURIComponent('03_干涉繞射色散')+'&routingVersion=v5&_t='+Date.now();
    await fetch(routedUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
