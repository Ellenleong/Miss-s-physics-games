<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固體壓強、切割與等體積/等質量演示 - NEO BRUTALISM EDITION</title>
    <!-- 引入 Neo-brutalism 標誌性字體 Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Neo-brutalism 色彩 Token */
            --bg-canvas: #FFFDF5;         /* 復古米白/奶油色底紙 */
            --ink-black: #000000;         /* 純黑結構線條 */
            --neo-red: #FF6B6B;           /* 高飽和亮紅 */
            --neo-yellow: #FFD93D;        /* 高亮黃色 */
            --neo-violet: #C4B5FD;        /* 柔和紫 */
            --neo-cyan: #38BDF8;          /* 亮青藍 (甲) */
            --neo-green: #34D399;         /* 亮螢光綠 */
            --neo-white: #FFFFFF;
            
            /* 陰影 Token */
            --shadow-sm: 3px 3px 0px 0px #000000;
            --shadow-md: 6px 6px 0px 0px #000000;
            --shadow-lg: 8px 8px 0px 0px #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-canvas);
            /* 40px 方格網紋紙底圖 (Grid Pattern) */
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.08) 1.5px, transparent 1.5px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.08) 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            color: var(--ink-black);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 15px;
            font-weight: 700;
        }

        /* 頂部導覽列 (貼紙拼貼風) */
        header {
            padding: 10px 20px;
            background: var(--neo-yellow);
            border-bottom: 4px solid var(--ink-black);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 4px 0px 0px #000;
            z-index: 10;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            color: var(--ink-black);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-tag {
            background: var(--neo-red);
            color: var(--neo-white);
            border: 3px solid var(--ink-black);
            padding: 2px 8px;
            box-shadow: var(--shadow-sm);
            transform: rotate(-2deg);
            display: inline-block;
        }

        .header-sub {
            font-size: 1rem;
            background: var(--neo-white);
            color: var(--ink-black);
            font-weight: 900;
            border: 3px solid var(--ink-black);
            padding: 4px 14px;
            box-shadow: var(--shadow-sm);
            transform: rotate(1deg);
        }

        /* 主容器佈局 */
        .container {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 16px;
            padding: 14px 18px;
            flex: 1;
            min-height: 0;
            max-width: 1920px;
            margin: 0 auto;
            width: 100%;
        }

        /* 畫布卡片 */
        .canvas-card {
            background: var(--neo-white);
            border: 4px solid var(--ink-black);
            border-radius: 0px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 側邊控制欄 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            justify-content: space-between;
        }

        /* 新粗獷主義卡片容器 */
        .neo-card {
            background: var(--neo-white);
            border: 4px solid var(--ink-black);
            border-radius: 0px;
            padding: 12px 14px;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            color: var(--ink-black);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--ink-black);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-label {
            font-size: 0.88rem;
            font-weight: 900;
            color: var(--ink-black);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* 參數調節卡片 */
        .param-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .param-card {
            background: var(--neo-cyan);
            border: 3px solid var(--ink-black);
            padding: 8px 10px;
            box-shadow: var(--shadow-sm);
        }
        .param-card.card-b {
            background: var(--neo-yellow);
        }

        .btn-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .btn-triple {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        /* 新粗獷主義機械按鈕 (Tactile Mechanical Buttons) */
        button {
            padding: 8px 8px;
            font-size: 0.9rem;
            font-weight: 900;
            font-family: inherit;
            border-radius: 0px;
            border: 3px solid var(--ink-black);
            background: var(--neo-white);
            color: var(--ink-black);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        button:hover {
            background: var(--neo-yellow);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px 0px #000;
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px 0px #000;
        }

        button.active {
            background: var(--neo-red) !important;
            color: var(--neo-white) !important;
            box-shadow: inset 2px 2px 0px #000;
        }

        button.active-amber {
            background: var(--neo-yellow) !important;
            color: var(--ink-black) !important;
            box-shadow: inset 2px 2px 0px #000;
        }

        /* 滑桿造型 */
        .slider-container {
            background: var(--bg-canvas);
            padding: 6px 10px;
            border: 3px solid var(--ink-black);
            box-shadow: var(--shadow-sm);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 12px;
            background: var(--neo-white);
            border: 2px solid var(--ink-black);
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: var(--neo-red);
            border: 3px solid var(--ink-black);
            box-shadow: 2px 2px 0px #000;
            cursor: grab;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.15);
            background: var(--neo-yellow);
        }

        /* 物理原理常駐看板 */
        .physics-explanation {
            background: var(--neo-violet);
            border: 3px solid var(--ink-black);
            padding: 10px 12px;
            font-size: 0.88rem;
            line-height: 1.5;
            color: var(--ink-black);
            min-height: 140px;
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }

        .formula-tag {
            display: inline-block;
            background: var(--neo-white);
            border: 2px solid var(--ink-black);
            padding: 0px 6px;
            margin: 1px 2px;
            box-shadow: 2px 2px 0px #000;
            font-family: monospace;
            font-weight: 900;
            color: var(--ink-black);
        }
    </style>
</head>
<body>

    <header>
        <h1><span class="header-tag">NEO-PHYSICS</span> 固體壓強與幾何切割演示</h1>
        <div class="header-sub">柱體壓強公式：p = ρ · g · h = F / S</div>
    </header>

    <div class="container">
        <!-- 畫布主畫面 -->
        <div class="canvas-card">
            <canvas id="simCanvas"></canvas>
        </div>

        <!-- 側邊控制欄 -->
        <div class="sidebar">
            
            <!-- 參數調節區 -->
            <div class="neo-card">
                <div class="section-title">
                    <span>⚙️ 物理參數調節</span>
                    <button style="font-size:0.75rem; padding:3px 8px; background:var(--neo-green);" onclick="matchPressure()">⚡ 一鍵配平</button>
                </div>

                <div class="param-grid">
                    <div class="param-card">
                        <div style="font-weight:900; color:var(--ink-black); margin-bottom:4px; font-size:0.85rem; border-bottom: 2px solid #000; padding-bottom: 2px;">物體 甲 (BLUE)</div>
                        <div class="form-label" style="font-size:0.75rem;">
                            <span>密度 ρ:</span><span id="disp-rho-a">1.00 g/cm³</span>
                        </div>
                        <input type="range" id="slider-rho-a" min="0.5" max="3.0" step="0.05" value="1.00" oninput="changeParam('rhoA', this.value)">
                        
                        <div class="form-label" style="font-size:0.75rem; margin-top:4px;">
                            <span>邊長 L:</span><span id="disp-len-a">15 cm</span>
                        </div>
                        <input type="range" id="slider-len-a" min="8" max="18" step="1" value="15" oninput="changeParam('lenA', this.value)">
                    </div>

                    <div class="param-card card-b">
                        <div style="font-weight:900; color:var(--ink-black); margin-bottom:4px; font-size:0.85rem; border-bottom: 2px solid #000; padding-bottom: 2px;">物體 乙 (YELLOW)</div>
                        <div class="form-label" style="font-size:0.75rem;">
                            <span>密度 ρ:</span><span id="disp-rho-b">1.50 g/cm³</span>
                        </div>
                        <input type="range" id="slider-rho-b" min="0.5" max="3.0" step="0.05" value="1.50" oninput="changeParam('rhoB', this.value)">
                        
                        <div class="form-label" style="font-size:0.75rem; margin-top:4px;">
                            <span>邊長 L:</span><span id="disp-len-b">10 cm</span>
                        </div>
                        <input type="range" id="slider-len-b" min="8" max="18" step="1" value="10" oninput="changeParam('lenB', this.value)">
                    </div>
                </div>
            </div>

            <!-- 切割控制區 -->
            <div class="neo-card">
                <div class="section-title">🔪 切割方式與比較</div>

                <div class="form-group">
                    <div class="form-label">1. 操作對象</div>
                    <div class="btn-triple">
                        <button id="target-A" class="active" onclick="setTarget('A')">物體 甲</button>
                        <button id="target-B" onclick="setTarget('B')">物體 乙</button>
                        <button id="target-Both" onclick="setTarget('Both')">甲 ＆ 乙</button>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label">2. 切割模式</div>
                    <div class="btn-grid-3">
                        <button id="cut-vert" class="active-amber" onclick="setCutType('vertical')">🔪 垂直豎切</button>
                        <button id="cut-horiz-mass" onclick="setCutType('horiz-mass')">⚖️ 切等質量</button>
                        <button id="cut-horiz-vol" onclick="setCutType('horiz-vol')">📦 切等體積</button>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label">
                        <span id="slider-title">3. 切割比例 (Δ)</span>
                        <span id="cut-val-display" style="background:var(--neo-red); color:#fff; padding:1px 6px; border:2px solid #000; font-size:0.85rem;">切除 0%</span>
                    </div>
                    <div class="slider-container">
                        <input type="range" id="cutSlider" min="0" max="80" value="0" step="5" oninput="updateCutRatio(this.value)">
                    </div>
                </div>
            </div>

            <!-- 水果配重區 -->
            <div class="neo-card">
                <div class="section-title">🍎 甲頂部配重 (+F)</div>
                <div class="btn-triple">
                    <button onclick="addFruit('apple')">🍎 蘋果 (+20N)</button>
                    <button onclick="addFruit('durian')">🍈 榴槤 (+80N)</button>
                    <button style="background:var(--bg-canvas);" onclick="clearFruit()">🗑️ 清空</button>
                </div>
            </div>

            <!-- 原理常駐面板 -->
            <div class="neo-card" style="flex:1; display:flex; flex-direction:column;">
                <div class="section-title">💡 物理原理推導 (動態計算)</div>
                <div class="physics-explanation" id="principle-box">
                    滑動切割比例或點選操作以進行對比。
                </div>
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resize);

        const SPONGE_Y = 270; 
        const SPONGE_K = 0.32;
        const PIXEL_SCALE = 9;

        let target = 'A'; 
        let cutType = 'vertical'; 
        let cutRatio = 0; 
        let fruitsOnA = [];

        // Neo-brutalist 色彩配置
        const blockA = {
            name: "正方體 甲",
            length: 15,
            rho: 1.00,
            color: '#38BDF8' // Neo Cyan
        };

        const blockB = {
            name: "正方體 乙",
            length: 10,
            rho: 1.50,
            color: '#FFD93D' // Neo Yellow
        };

        function changeParam(param, val) {
            val = parseFloat(val);
            if (param === 'rhoA') {
                blockA.rho = val;
                document.getElementById('disp-rho-a').innerText = `${val.toFixed(2)} g/cm³`;
            } else if (param === 'lenA') {
                blockA.length = val;
                document.getElementById('disp-len-a').innerText = `${val} cm`;
            } else if (param === 'rhoB') {
                blockB.rho = val;
                document.getElementById('disp-rho-b').innerText = `${val.toFixed(2)} g/cm³`;
            } else if (param === 'lenB') {
                blockB.length = val;
                document.getElementById('disp-len-b').innerText = `${val} cm`;
            }
            updateExplanation();
        }

        function matchPressure() {
            const pA = blockA.rho * blockA.length;
            const newRhoB = pA / blockB.length;
            blockB.rho = Math.min(Math.max(newRhoB, 0.5), 3.0);
            document.getElementById('slider-rho-b').value = blockB.rho.toFixed(2);
            document.getElementById('disp-rho-b').innerText = `${blockB.rho.toFixed(2)} g/cm³`;
            updateExplanation();
        }

        function addFruit(type) {
            if (fruitsOnA.length >= 4) return;
            fruitsOnA.push(type);
            updateExplanation();
        }

        function clearFruit() {
            fruitsOnA = [];
            updateExplanation();
        }

        function getFruitWeight() {
            let w = 0;
            fruitsOnA.forEach(f => {
                if (f === 'apple') w += 20;
                if (f === 'durian') w += 80;
            });
            return w;
        }

        function setTarget(t) {
            target = t;
            document.getElementById('target-A').classList.toggle('active', t === 'A');
            document.getElementById('target-B').classList.toggle('active', t === 'B');
            document.getElementById('target-Both').classList.toggle('active', t === 'Both');
            updateExplanation();
        }

        function setCutType(type) {
            cutType = type;
            document.getElementById('cut-vert').classList.toggle('active-amber', type === 'vertical');
            document.getElementById('cut-horiz-mass').classList.toggle('active-amber', type === 'horiz-mass');
            document.getElementById('cut-horiz-vol').classList.toggle('active-amber', type === 'horiz-vol');
            
            if (type === 'horiz-mass' || type === 'horiz-vol') {
                setTarget('Both');
            }

            if (type === 'horiz-mass') {
                document.getElementById('slider-title').innerText = "3. 切除質量 (Δm)";
            } else if (type === 'horiz-vol') {
                document.getElementById('slider-title').innerText = "3. 切除體積 (ΔV)";
            } else {
                document.getElementById('slider-title').innerText = "3. 切割比例 (Δ)";
            }
            updateCutRatio(document.getElementById('cutSlider').value);
        }

        function updateCutRatio(val) {
            cutRatio = parseFloat(val) / 100;
            if (cutType === 'horiz-mass') {
                const totalMassB = blockB.rho * Math.pow(blockB.length, 3);
                const deltaM = (totalMassB * cutRatio).toFixed(0);
                document.getElementById('cut-val-display').innerText = `切除 Δm = ${deltaM} g`;
            } else if (cutType === 'horiz-vol') {
                const totalVolB = Math.pow(blockB.length, 3);
                const deltaV = (totalVolB * cutRatio).toFixed(0);
                document.getElementById('cut-val-display').innerText = `切除 ΔV = ${deltaV} cm³`;
            } else {
                document.getElementById('cut-val-display').innerText = `切除 ${val}%`;
            }
            updateExplanation();
        }

        function updateExplanation() {
            const box = document.getElementById('principle-box');
            
            const fruitW = getFruitWeight();
            const pA_initial = blockA.rho * blockA.length;
            const pB_initial = blockB.rho * blockB.length;
            const sA = blockA.length * blockA.length;
            const sB = blockB.length * blockB.length;
            
            const isPressureEqual = Math.abs(pA_initial - pB_initial) < 0.1;

            let contentHTML = "";

            if (fruitW > 0) {
                contentHTML += `<div style="background:#FFE4E6; border:2px solid #000; padding:4px 8px; margin-bottom:6px; box-shadow:2px 2px 0 #000;">
                🍎 <strong>【水果加壓】</strong> 甲加載 <span class="formula-tag">+${fruitW} N</span>，底面積 <span class="formula-tag">S<sub>甲</sub></span> 不變。<br>
                由 <span class="formula-tag">p = (G+G<sub>果</sub>)/S</span>，甲壓強明顯增加！</div>`;
            }

            if (cutRatio === 0) {
                if (isPressureEqual) {
                    contentHTML += `<strong>【未切割狀態 - 壓強相等】</strong><br>
                    滿足 <span class="formula-tag">ρ<sub>甲</sub>h<sub>甲</sub> = ρ<sub>乙</sub>h<sub>乙</sub></span><br>
                    👉 <strong>結論：兩者壓強相等，海綿下陷深度完全一致。</strong>`;
                } else {
                    contentHTML += `<strong>【未切割狀態 - 參數自由調節】</strong><br>
                    • p<sub>甲</sub> = ${pA_initial.toFixed(1)} Pa<br>
                    • p<sub>乙</sub> = ${pB_initial.toFixed(1)} Pa<br>
                    👉 <strong>結論：下陷深度正比於各自的 <span class="formula-tag">ρ · h</span>。</strong>`;
                }
            } else if (cutType === 'vertical') {
                contentHTML += `<strong>【垂直豎切分析】</strong><br>
                • 壓力與受力面積同比例縮小，比值不變：<span class="formula-tag">F/S = (1-k)F₀/(1-k)S₀ = p₀</span><br>
                • 柱體高度(h)與密度(ρ)未改變：<span class="formula-tag">p = ρ · g · h</span><br>
                👉 <strong>結論：垂直豎切時，剩餘壓強與下陷深度完全不變！</strong>`;
            } else if (cutType === 'horiz-mass') {
                let relationStr = "";
                if (sA > sB) {
                    relationStr = `因底面積 <span class="formula-tag">S<sub>甲</sub> > S<sub>乙</sub></span>，甲壓強減少較少 (Δp<sub>甲</sub> < Δp<sub>乙</sub>)。`;
                    if(isPressureEqual) relationStr += `<br>👉 <strong>剩餘壓強 p<sub>甲</sub> > p<sub>乙</sub>，甲下陷深度較大！</strong>`;
                } else if (sA < sB) {
                    relationStr = `因底面積 <span class="formula-tag">S<sub>甲</sub> < S<sub>乙</sub></span>，乙壓強減少較少 (Δp<sub>甲</sub> > Δp<sub>乙</sub>)。`;
                    if(isPressureEqual) relationStr += `<br>👉 <strong>剩餘壓強 p<sub>乙</sub> > p<sub>甲</sub>，乙下陷深度較大！</strong>`;
                } else {
                    relationStr = `底面積相同，兩者壓強減小量相同 (Δp<sub>甲</sub> = Δp<sub>乙</sub>)。`;
                }

                contentHTML += `<strong>【橫切相同質量 Δm 分析】</strong><br>
                • 壓強減少公式：<span class="formula-tag">Δp = Δm · g / S</span><br>
                • ${relationStr}`;
            } else if (cutType === 'horiz-vol') {
                const deltaP_ratioA = blockA.rho / sA;
                const deltaP_ratioB = blockB.rho / sB;
                let relationStr = "";

                if (deltaP_ratioA < deltaP_ratioB) {
                    relationStr = `因 <span class="formula-tag">ρ<sub>甲</sub>/S<sub>甲</sub> < ρ<sub>乙</sub>/S<sub>乙</sub></span>，甲的壓強減小量較少 (Δp<sub>甲</sub> < Δp<sub>乙</sub>)。`;
                    if(isPressureEqual) relationStr += `<br>👉 <strong>剩餘壓強 p<sub>甲</sub> > p<sub>乙</sub>，甲下陷深度較大！</strong>`;
                } else if (deltaP_ratioA > deltaP_ratioB) {
                    relationStr = `因 <span class="formula-tag">ρ<sub>甲</sub>/S<sub>甲</sub> > ρ<sub>乙</sub>/S<sub>乙</sub></span>，乙的壓強減小量較少 (Δp<sub>甲</sub> > Δp<sub>乙</sub>)。`;
                    if(isPressureEqual) relationStr += `<br>👉 <strong>剩餘壓強 p<sub>乙</sub> > p<sub>甲</sub>，乙下陷深度較大！</strong>`;
                } else {
                    relationStr = `因 <span class="formula-tag">ρ/S</span> 相同，兩者壓強減小量相同 (Δp<sub>甲</sub> = Δp<sub>乙</sub>)。`;
                }

                contentHTML += `<strong>【橫切相同體積 ΔV 分析】</strong><br>
                • 高度減少量：<span class="formula-tag">Δh = ΔV / S</span><br>
                • 壓強減少公式：<span class="formula-tag">Δp = ρ · g · Δh = ρ · g · (ΔV / S)</span><br>
                • ${relationStr}`;
            }

            box.innerHTML = contentHTML;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 畫布背景 (Neo-brutalist 紙紋方格)
            ctx.fillStyle = '#FFFDF5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 25;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            const centerX = canvas.width / 2;
            const centerAX = centerX - 240;
            const centerBX = centerX + 140;

            const fullWA = blockA.length * PIXEL_SCALE;
            const fullHA = blockA.length * PIXEL_SCALE;
            const fullWB = blockB.length * PIXEL_SCALE;
            const fullHB = blockB.length * PIXEL_SCALE;

            let curWA = fullWA, curHA = fullHA;
            let curWB = fullWB, curHB = fullHB;
            let ratioA = 0, ratioB = 0;

            if (cutType === 'horiz-mass') {
                const massB_total = blockB.rho * Math.pow(blockB.length, 3);
                const deltaM = massB_total * cutRatio; 

                const deltaHA_cm = deltaM / (blockA.rho * Math.pow(blockA.length, 2));
                const deltaHB_cm = deltaM / (blockB.rho * Math.pow(blockB.length, 2));

                curHA = Math.max(0, (blockA.length - deltaHA_cm) * PIXEL_SCALE);
                curHB = Math.max(0, (blockB.length - deltaHB_cm) * PIXEL_SCALE);

                ratioA = deltaHA_cm / blockA.length;
                ratioB = deltaHB_cm / blockB.length;
            } else if (cutType === 'horiz-vol') {
                const volB_total = Math.pow(blockB.length, 3);
                const deltaV = volB_total * cutRatio;

                const deltaHA_cm = deltaV / Math.pow(blockA.length, 2);
                const deltaHB_cm = deltaV / Math.pow(blockB.length, 2);

                curHA = Math.max(0, (blockA.length - deltaHA_cm) * PIXEL_SCALE);
                curHB = Math.max(0, (blockB.length - deltaHB_cm) * PIXEL_SCALE);

                ratioA = deltaHA_cm / blockA.length;
                ratioB = deltaHB_cm / blockB.length;
            } else if (cutType === 'vertical') {
                ratioA = (target === 'A' || target === 'Both') ? cutRatio : 0;
                ratioB = (target === 'B' || target === 'Both') ? cutRatio : 0;
                curWA = fullWA * (1 - ratioA);
                curWB = fullWB * (1 - ratioB);
            }

            const fruitWeight = getFruitWeight();
            const realAreaA = (curWA * curWA / 100);
            const deltaPA = (fruitWeight / realAreaA) * 10;

            const pA = blockA.rho * (curHA / PIXEL_SCALE) + deltaPA;
            const sinkA = pA * 10 * SPONGE_K;

            const pB = blockB.rho * (curHB / PIXEL_SCALE);
            const sinkB = pB * 10 * SPONGE_K;

            const posAX = centerAX - fullWA / 2;
            const posBX = centerBX - fullWB / 2;

            // 1. 繪製海綿底座 (Neo-brutalism 粗黑結構底座)
            ctx.fillStyle = '#E2E8F0';
            ctx.fillRect(0, SPONGE_Y, canvas.width, canvas.height - SPONGE_Y);
            
            // 海綿網點紋理 (Halftone Texture)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            for (let dotX = 10; dotX < canvas.width; dotX += 20) {
                for (let dotY = SPONGE_Y + 15; dotY < canvas.height; dotY += 20) {
                    ctx.beginPath();
                    ctx.arc(dotX, dotY, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 海綿形變頂面 (加厚黑邊)
            ctx.beginPath();
            ctx.moveTo(0, SPONGE_Y);
            ctx.lineTo(posAX - 25, SPONGE_Y);
            ctx.quadraticCurveTo(posAX, SPONGE_Y + sinkA, posAX + 12, SPONGE_Y + sinkA);
            ctx.lineTo(posAX + curWA - 12, SPONGE_Y + sinkA);
            ctx.quadraticCurveTo(posAX + curWA, SPONGE_Y + sinkA, posAX + curWA + 25, SPONGE_Y);

            ctx.lineTo(posBX - 25, SPONGE_Y);
            ctx.quadraticCurveTo(posBX, SPONGE_Y + sinkB, posBX + 12, SPONGE_Y + sinkB);
            ctx.lineTo(posBX + curWB - 12, SPONGE_Y + sinkB);
            ctx.quadraticCurveTo(posBX + curWB, SPONGE_Y + sinkB, posBX + curWB + 25, SPONGE_Y);

            ctx.lineTo(canvas.width, SPONGE_Y);
            ctx.lineTo(canvas.width, SPONGE_Y + 14);
            ctx.lineTo(0, SPONGE_Y + 14);
            ctx.closePath();
            
            ctx.fillStyle = '#CBD5E1';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000000';
            ctx.stroke();

            // 基準線 (高對比紅黑虛線)
            ctx.strokeStyle = '#FF6B6B';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.moveTo(0, SPONGE_Y);
            ctx.lineTo(canvas.width, SPONGE_Y);
            ctx.stroke();
            ctx.setLineDash([]);

            // 基準線標牌 (Neo-brutalist 貼紙標籤)
            ctx.fillStyle = '#000000';
            ctx.fillRect(16, 16, 220, 36); // 硬陰影
            ctx.fillStyle = '#FFD93D';
            ctx.fillRect(14, 14, 220, 36);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000000';
            ctx.strokeRect(14, 14, 220, 36);

            ctx.fillStyle = '#000000';
            ctx.font = "900 14px 'Space Grotesk', sans-serif";
            ctx.textAlign = 'left';
            ctx.fillText("--- 海綿基準線 (h = 0)", 26, 37);

            // 2. 繪製物體 甲 & 乙
            renderBlock(blockA, centerAX, posAX, curWA, curHA, fullWA, fullHA, sinkA, ratioA, fruitWeight);
            renderBlock(blockB, centerBX, posBX, curWB, curHB, fullWB, fullHB, sinkB, ratioB, 0);

            requestAnimationFrame(draw);
        }

        function renderBlock(b, centerX, x, w, h, fullW, fullH, sink, ratio, fruitW) {
            const currentY = SPONGE_Y + sink - h;

            // 方塊本體硬陰影 (Offset 6px)
            ctx.fillStyle = '#000000';
            ctx.fillRect(x + 6, currentY + 6, w, h);

            // 方塊主體
            ctx.fillStyle = b.color;
            ctx.fillRect(x, currentY, w, h);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000000';
            ctx.strokeRect(x, currentY, w, h);

            // 方塊名稱標籤 (粗體大字)
            ctx.fillStyle = '#000000';
            ctx.font = "900 22px 'Space Grotesk', sans-serif";
            ctx.textAlign = 'center';
            ctx.fillText(b.name, x + w / 2, currentY + h / 2 + 8);

            // 水果
            if (b.name.includes("甲") && fruitsOnA.length > 0) {
                const fruitSpacing = w / (fruitsOnA.length + 1);
                fruitsOnA.forEach((fruit, idx) => {
                    const fx = x + fruitSpacing * (idx + 1);
                    const fy = currentY - 16;
                    ctx.font = "28px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(fruit === 'apple' ? "🍎" : "🍈", fx, fy);
                });
            }

            // 切除虛影 (黑白斜條紋質感)
            if (ratio > 0.005) {
                ctx.save();
                if (cutType === 'vertical') {
                    const cutW = fullW * ratio;
                    const cutX = x + w + 12;
                    ctx.fillStyle = 'rgba(0,0,0,0.08)';
                    ctx.fillRect(cutX, currentY, cutW, h);
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#000000';
                    ctx.setLineDash([6, 6]);
                    ctx.strokeRect(cutX, currentY, cutW, h);
                } else {
                    const cutH = fullH * ratio;
                    const cutY = currentY - cutH - 12;
                    ctx.fillStyle = 'rgba(0,0,0,0.08)';
                    ctx.fillRect(x, cutY, w, cutH);
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#000000';
                    ctx.setLineDash([6, 6]);
                    ctx.strokeRect(x, cutY, w, cutH);
                }
                ctx.restore();
            }

            // 下陷指示 (硬派紅色標籤)
            const arrowX = x + w + 10;
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(arrowX, SPONGE_Y);
            ctx.lineTo(arrowX, SPONGE_Y + sink);
            ctx.stroke();

            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(arrowX + 4, SPONGE_Y + sink / 2 - 12, 85, 24);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000000';
            ctx.strokeRect(arrowX + 4, SPONGE_Y + sink / 2 - 12, 85, 24);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = "900 13px 'Space Grotesk', monospace";
            ctx.textAlign = 'left';
            ctx.fillText(`深:${(sink/10/SPONGE_K).toFixed(1)}cm`, arrowX + 8, SPONGE_Y + sink / 2 + 4);

            // ==========================================
            // 物體下方數據看板 (Neo-brutalist 卡片)
            // ==========================================
            const panelY = SPONGE_Y + 50;
            const panelW = 230;
            const panelH = 165;
            const panelX = centerX - panelW / 2;

            // 硬陰影
            ctx.fillStyle = '#000000';
            ctx.fillRect(panelX + 6, panelY + 6, panelW, panelH);

            // 主體卡片
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(panelX, panelY, panelW, panelH);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000000';
            ctx.strokeRect(panelX, panelY, panelW, panelH);

            // 頂部小色條
            ctx.fillStyle = b.color;
            ctx.fillRect(panelX, panelY, panelW, 28);
            ctx.strokeRect(panelX, panelY, panelW, 28);

            const curH_cm = (h / PIXEL_SCALE);
            const curW_cm = (w / PIXEL_SCALE);
            const S_val = (curW_cm * curW_cm).toFixed(1);
            const baseF = (b.rho * (curW_cm * curW_cm * curH_cm));
            const totalF = (baseF + fruitW).toFixed(1);
            const p_val = (sink / 10 / SPONGE_K).toFixed(2);

            // 卡片標題
            ctx.fillStyle = '#000000';
            ctx.font = "900 14px 'Space Grotesk', sans-serif";
            ctx.textAlign = 'left';
            ctx.fillText(`【${b.name} 數據】`, panelX + 10, panelY + 19);

            ctx.font = "700 13px 'Space Grotesk', monospace";
            ctx.fillStyle = '#000000';
            
            let lineY = panelY + 50;
            ctx.fillText(`密度 ρ  = ${b.rho.toFixed(2)} g/cm³`, panelX + 12, lineY);

            lineY += 22;
            ctx.fillText(`高度 h  = ${curH_cm.toFixed(1)} cm`, panelX + 12, lineY);

            lineY += 22;
            ctx.fillText(`總壓力 F = ${totalF} N`, panelX + 12, lineY);

            lineY += 22;
            ctx.fillText(`底面積 S = ${S_val} cm²`, panelX + 12, lineY);

            // 壓強特別凸顯標籤
            lineY += 24;
            ctx.fillStyle = '#FFD93D';
            ctx.fillRect(panelX + 8, lineY - 16, panelW - 16, 22);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000000';
            ctx.strokeRect(panelX + 8, lineY - 16, panelW - 16, 22);

            ctx.font = "900 14px 'Space Grotesk', monospace";
            ctx.fillStyle = '#000000';
            ctx.fillText(`壓強 p  = ${p_val} Pa`, panelX + 14, lineY);
        }

        resize();
        updateExplanation();
        draw();
    </script>
</body>
